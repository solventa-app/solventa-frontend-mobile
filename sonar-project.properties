sonar.organization=global-spark
sonar.projectKey=global-spark_solventa-mobile
sonar.projectName=Solventa Mobile
sonar.host.url=https://sonarcloud.io
sonar.sources=lib
sonar.tests=test
# Código generado: no se analiza ni cuenta para la cobertura. Los *.graphql.dart salen de graphql_codegen
# (build.yaml) y lib/core/l10n/gen/ de flutter gen-l10n (l10n.yaml).
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/*.graphql.dart,**/generated/**,**/l10n/gen/**,build/**,android/**,ios/**
# `flutter test --coverage` escribe coverage/lcov.info con las rutas ya relativas a la raíz del repo (lib/…).
sonar.dart.lcov.reportPaths=coverage/lcov.info
