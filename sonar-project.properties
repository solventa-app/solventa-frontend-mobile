sonar.organization=global-spark
sonar.projectKey=global-spark_solventa-frontend-mobile
sonar.projectName=Solventa Frontend Mobile
sonar.host.url=https://sonarcloud.io
sonar.sources=lib
sonar.tests=test
# Código generado: no se analiza ni cuenta para la cobertura.
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**,**/l10n/app_localizations*.dart,build/**,android/**,ios/**
# `flutter test --coverage` escribe coverage/lcov.info con las rutas ya relativas a la raíz del repo (lib/…).
sonar.dart.lcov.reportPaths=coverage/lcov.info
