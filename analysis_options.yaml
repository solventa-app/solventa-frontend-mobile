# Reglas del analizador (docs/ci-cd.md, "Linter y formato"). El CI corre `flutter analyze` y falla con cualquier
# hallazgo, incluidos los de nivel info.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Como el modo estricto de TypeScript en el web: sin `dynamic` escondidos.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  # Errores típicos de async y de recursos que flutter_lints no marca.
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
