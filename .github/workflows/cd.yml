name: CD

# Cada merge a main (solo llega desde develop o fix/KAN-N-*, ver pr-rama.yml) genera APK + AAB firmados.
on:
  push:
    branches: [main]

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Leer versión de pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION+${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Restaurar keystore de firmado
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Build AAB (Google Play)
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Renombrar artefactos
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/solventa-${{ steps.version.outputs.name }}-${{ github.run_number }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/solventa-${{ steps.version.outputs.name }}-${{ github.run_number }}.aab"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: dist/*
          retention-days: 30

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Solventa ${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          generate_release_notes: true
          files: dist/*
