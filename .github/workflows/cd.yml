name: CD

# Cada merge a main (solo llega desde release/sprint-N o hotfix/KAN-N-*, ver pr-rama.yml) genera la versión de
# prod: versión calculada desde los títulos de los PR, APK + AAB firmados y ofuscados, y GitHub Release con los
# archivos, el mapping y los símbolos. Por ahora no hay Google Play: el APK del Release es lo que se instala.
# El AAB queda listo para cuando exista la tienda (docs/ci-cd.md, "Google Play (futuro)").
# Manual desde otra rama: compila igual, pero no crea tag ni Release (sirve para probar el CD).
# Ver docs/ci-cd.md ("Versionado", "R8, ofuscación y símbolos") y rollback.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prod:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write # tag y Release
      packages: write # imagen del devcontainer
    env:
      PUBLICAR: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags e historial para calcular la versión

      - name: Calcular versión
        id: version
        run: |
          pip install --quiet git-cliff==2.14.2
          tool/version.sh prod
          git-cliff --unreleased --strip all > notas.md

      - name: Restaurar llave de firmado de prod
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: tool/firma.sh prod

      - name: Build de prod
        uses: ./.github/actions/devcontainer
        with:
          run: tool/build-prod.sh ${{ steps.version.outputs.nombre }} ${{ steps.version.outputs.build }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prod-${{ steps.version.outputs.nombre }}+${{ steps.version.outputs.build }}
          path: dist/*
          retention-days: 30

      - name: Crear GitHub Release
        if: env.PUBLICAR == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Solventa ${{ steps.version.outputs.nombre }} (build ${{ steps.version.outputs.build }})
          body_path: notas.md
          files: dist/*
