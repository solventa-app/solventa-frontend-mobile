name: Develop

# Cada merge a develop: APK de dev firmado (paquete com.solventa.solventa_mobile.dev, "Solventa Dev"),
# a Firebase App Distribution para QA y revisado con MobSF. Ver docs/ci-cd.md.
# Las pruebas en emuladores están en emuladores.yml.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: develop
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    permissions:
      contents: read
      packages: write
    outputs:
      nombre: ${{ steps.version.outputs.nombre }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Calcular versión
        id: version
        run: |
          pip install --quiet git-cliff==2.14.2
          tool/version.sh dev "$GITHUB_RUN_NUMBER"

      # Una sola llave de dev para todo el equipo: cada build nuevo se instala encima del anterior.
      - name: Restaurar llave de firmado de dev
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_DEV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_DEV_KEY_PASSWORD }}
        run: tool/firma.sh dev

      - name: Build de dev
        uses: ./.github/actions/devcontainer
        with:
          run: tool/build-dev.sh ${{ steps.version.outputs.nombre }} ${{ steps.version.outputs.build }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-dev
          path: dist/*.apk
          retention-days: 14

  distribucion:
    name: App Distribution
    # Se salta solo mientras no existan FIREBASE_SERVICE_ACCOUNT y la variable FIREBASE_APP_ID_DEV.
    needs: apk-dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    steps:
      - name: ¿Firebase configurado?
        id: firebase
        env:
          CUENTA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_ID: ${{ vars.FIREBASE_APP_ID_DEV }}
        run: |
          if [ -n "$CUENTA" ] && [ -n "$APP_ID" ]; then
            echo "listo=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=App Distribution::Falta FIREBASE_SERVICE_ACCOUNT o FIREBASE_APP_ID_DEV: el APK queda como artifact apk-dev."
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.firebase.outputs.listo == 'true'
        with:
          name: apk-dev
          path: dist

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.firebase.outputs.listo == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Subir a App Distribution (grupo qa)
        if: steps.firebase.outputs.listo == 'true'
        env:
          APP_ID: ${{ vars.FIREBASE_APP_ID_DEV }}
          NOMBRE: ${{ needs.apk-dev.outputs.nombre }}
          COMMIT: ${{ github.sha }}
        run: |
          npx --yes firebase-tools@14 appdistribution:distribute dist/*.apk \
            --app "$APP_ID" \
            --groups qa \
            --release-notes "Solventa Dev $NOMBRE · commit ${COMMIT:0:7}"

  mobsf:
    name: MobSF
    # Análisis estático del APK: permisos, manifest, cifrado, llaves embebidas, librerías inseguras.
    # Informativo: el reporte queda como artifact `mobsf` (PDF y JSON) y la nota en el resumen del job.
    needs: apk-dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-dev
          path: dist

      - name: Analizar el APK
        run: |
          llave=$(openssl rand -hex 32)
          docker run -d --name mobsf -p 8000:8000 -e MOBSF_API_KEY="$llave" \
            opensecurity/mobile-security-framework-mobsf:v4.5.3
          for _ in $(seq 60); do
            curl -sf -o /dev/null http://localhost:8000/api/v1/scans -H "Authorization: $llave" && break
            sleep 5
          done
          apk=$(ls dist/*.apk)
          hash=$(curl -sf -F "file=@$apk" http://localhost:8000/api/v1/upload -H "Authorization: $llave" | jq -r .hash)
          curl -sf -X POST --data "hash=$hash" http://localhost:8000/api/v1/scan -H "Authorization: $llave" > /dev/null
          mkdir -p mobsf
          curl -sf -X POST --data "hash=$hash" http://localhost:8000/api/v1/report_json -H "Authorization: $llave" > mobsf/reporte.json
          curl -sf -X POST --data "hash=$hash" http://localhost:8000/api/v1/download_pdf -H "Authorization: $llave" > mobsf/reporte.pdf
          curl -sf -X POST --data "hash=$hash" http://localhost:8000/api/v1/scorecard -H "Authorization: $llave" > mobsf/scorecard.json
          {
            echo "### MobSF"
            echo "Puntaje de seguridad: $(jq -r '.security_score // "?"' mobsf/scorecard.json)/100"
            echo "Hallazgos altos: $(jq -r '(.high // []) | length' mobsf/scorecard.json)"
            echo "Hallazgos de advertencia: $(jq -r '(.warning // []) | length' mobsf/scorecard.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mobsf
          path: mobsf/
          if-no-files-found: ignore
