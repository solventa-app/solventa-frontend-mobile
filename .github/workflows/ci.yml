name: CI mobile

# Corre en todo PR (sin filtro de rutas): el check `mobile` es obligatorio en `main` y `develop`.
# Todo corre dentro del devcontainer, la misma imagen que se usa en local (docs/entorno-local.md).
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # publica la imagen del devcontainer en GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Versiones, formato, análisis, pruebas con cobertura y el APK de dev compilado en release (R8 incluido).
      - uses: ./.github/actions/devcontainer
        with:
          run: tool/verificar.sh --apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
