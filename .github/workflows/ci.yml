name: CI mobile

# Corre en todo PR (sin filtro de rutas): el check `mobile` es obligatorio en `main` y `develop`.
on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
