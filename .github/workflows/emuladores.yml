name: Emuladores

# integration_test/ en emuladores Android de varios tamaños y versiones (docs/ci-cd.md, "Granja de dispositivos").
# El emulador necesita KVM, que no hay dentro de nuestro contenedor: corre directo en el runner, con la misma
# versión de Flutter que fija pubspec.yaml (tool/verificar-versiones.sh lo comprueba).
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: emuladores-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulador:
    name: ${{ matrix.nombre }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: Teléfono pequeño (API 28)
            api: 28
            perfil: Nexus 5 # 360 dp de ancho, el mínimo soportado
          - nombre: Teléfono grande (API 34)
            api: 34
            perfil: pixel_7_pro
          - nombre: Tablet (API 34)
            api: 34
            perfil: pixel_tablet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - run: tool/verificar-versiones.sh
      - run: flutter pub get

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api }}-${{ matrix.perfil }}

      - name: Pruebas de integración
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.perfil }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: flutter test integration_test --flavor dev --dart-define-from-file=config/mock.json
