name: Emuladores

# integration_test/ en emuladores Android de varios tamaños y versiones (docs/ci-cd.md, "Granja de dispositivos").
# El emulador necesita KVM, que no hay dentro de nuestro contenedor: corre directo en el runner, con la misma
# versión de Flutter que fija pubspec.yaml (tool/verificar-versiones.sh lo comprueba).
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: emuladores-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulador:
    name: ${{ matrix.nombre }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: Teléfono pequeño (API 28)
            clave: pequeno-api28
            api: 28
            perfil: Nexus 5 # 360 dp de ancho, el mínimo soportado
          - nombre: Teléfono grande (API 34)
            clave: grande-api34
            api: 34
            perfil: pixel_7_pro
          - nombre: Tablet (API 34)
            clave: tablet-api34
            api: 34
            perfil: pixel_tablet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - run: tool/verificar-versiones.sh
      - run: flutter pub get

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api }}-${{ matrix.perfil }}

      - name: Pruebas de integración
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.perfil }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # CAPTURAS y el reporter JSON alimentan el reporte HTML (job «Reporte»).
          script: |
            mkdir -p build/reporte
            flutter test integration_test --flavor dev --dart-define-from-file=config/mock.json --dart-define=CAPTURAS=true --file-reporter json:build/reporte/resultados.json

      - name: Datos del emulador para el reporte
        if: always()
        env:
          NOMBRE: ${{ matrix.nombre }}
        run: |
          mkdir -p build/reporte
          printf '%s\n' "$NOMBRE" > build/reporte/dispositivo.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: resultados-${{ matrix.clave }}
          path: build/reporte/
          retention-days: 3
          if-no-files-found: ignore

  # Un solo HTML con los tres emuladores: qué pasó y qué falló, el error y capturas de pantalla.
  # Corre siempre (pase o falle) para que alguien lo revise rápido. No bloquea: Emuladores solo
  # corre después del merge a develop.
  reporte:
    name: Reporte
    needs: emulador
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: resultados-*
          path: build/resultados

      - name: Generar reporte
        env:
          SHA: ${{ github.sha }}
          RAMA: ${{ github.ref_name }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p build/resultados dist
          for d in build/resultados/*/; do
            [ -d "$d" ] && printf 'Commit <code>%s</code> en <code>%s</code> · <a href="%s">ver la corrida</a>\n' "${SHA:0:7}" "$RAMA" "$CORRIDA" > "$d/contexto.txt"
          done
          python3 tool/reporte-emuladores.py build/resultados dist/reporte-emuladores.html "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporte-emuladores
          path: dist/reporte-emuladores.html
          retention-days: 14
