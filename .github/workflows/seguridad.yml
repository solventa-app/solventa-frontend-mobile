name: Seguridad

# Mismas herramientas que solventa-backend (docs/ci-cd.md, "Seguridad"). Corre en todo PR, en cada push a
# develop y cada lunes (una vulnerabilidad nueva puede aparecer sin que cambie el código).
# MobSF necesita el APK compilado y corre en develop.yml.
on:
  pull_request:
  push:
    branches: [develop]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secretos:
    name: Secretos (gitleaks)
    # "Nunca secretos en el repo": keystores, key.properties, google-services.json, tokens. Se revisa todo el
    # historial, no solo el último commit.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Buscar secretos
        run: |
          docker run --rm -v "$PWD:/repo" --entrypoint sh ghcr.io/gitleaks/gitleaks:v8.30.1 \
            -c 'git config --global --add safe.directory /repo && gitleaks git /repo --no-banner --redact --verbose'

  dependencias:
    name: Dependencias (osv-scanner)
    # Revisa pubspec.lock contra la base de vulnerabilidades OSV. Informativo hasta confirmar que no hay
    # hallazgos; después se quita continue-on-error.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Vulnerabilidades conocidas
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/google/osv-scanner:v2.7.0 scan --lockfile pubspec.lock

  flujos:
    name: Workflows (actionlint)
    # Los workflows no se pueden probar hasta que corren en GitHub: actionlint atrapa antes los errores de
    # sintaxis, expresiones y contextos (y revisa los scripts con shellcheck).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint de workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Acciones fijadas por SHA
        # `uses: dueño/accion@<sha de 40> # vX`, para que nadie cambie una acción por debajo. Dependabot las
        # sigue actualizando. Las acciones locales (./.github/actions/…) no aplican.
        run: |
          # Solo líneas que son un paso `uses:` (no comentarios ni este mismo mensaje de error).
          sueltas=$(grep -rhE '^[[:space:]]*(- )?uses: *[^ .]' .github/workflows .github/actions \
            | sed -E 's/^[[:space:]]*(- )?uses: *//; s/ *#.*$//' \
            | grep -vE '@[0-9a-f]{40}$' || true)
          if [ -n "$sueltas" ]; then
            echo "::error title=Acciones sin SHA::Fija estas acciones por SHA (uses: dueño/accion@<sha> # vX):"
            echo "$sueltas"
            exit 1
          fi
