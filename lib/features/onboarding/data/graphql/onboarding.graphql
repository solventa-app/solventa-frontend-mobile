# HU-M01: recorrido de onboarding del contrato v0.20. Todas, salvo IniciarOnboarding y las de sesión, van con la
# cabecera `X-Onboarding-Token` (la agrega el datasource).

fragment OnboardingCampos on Onboarding {
  id
  estado
  motivo
  intento
  intentosRestantes
}

# `segundosRestantes` (v0.31): solo con ESPERA_REQUERIDA; es lo que falta para poder reenviar el código.
fragment ErrorOnboardingCampos on ErrorOnboarding {
  codigo
  segundosRestantes
}

# M01-02: al entrar a la autorización.
mutation IniciarOnboarding($entrada: IniciarOnboardingInput!) {
  iniciarOnboarding(entrada: $entrada) {
    __typename
    ... on InicioOnboarding {
      token
      tokenVenceEn
      onboarding {
        ...OnboardingCampos
      }
    }
    ...ErrorOnboardingCampos
  }
}

# M01-02 «Acepto»: consentimiento `onboarding-biometrico` (append-only) antes de cualquier captura.
mutation RegistrarConsentimientoOnboarding($onboardingId: ID!, $versionTexto: String!) {
  registrarConsentimientoOnboarding(onboardingId: $onboardingId, versionTexto: $versionTexto) {
    __typename
    ...OnboardingCampos
    ...ErrorOnboardingCampos
  }
}

# M01-03 a M01-05: URL firmada para una pieza; luego PUT directo y ConfirmarSubidaOnboarding.
mutation SolicitarSubidaOnboarding(
  $onboardingId: ID!
  $paso: PasoOnboarding!
  $tipoContenido: String!
  $tamanoBytes: Int!
) {
  solicitarSubidaOnboarding(
    onboardingId: $onboardingId
    paso: $paso
    tipoContenido: $tipoContenido
    tamanoBytes: $tamanoBytes
  ) {
    __typename
    ... on SubidaArchivo {
      url
      metodo
      encabezados {
        nombre
        valor
      }
      archivo {
        id
      }
    }
    ...ErrorOnboardingCampos
  }
}

mutation ConfirmarSubidaOnboarding($onboardingId: ID!, $archivoId: ID!) {
  confirmarSubidaOnboarding(onboardingId: $onboardingId, archivoId: $archivoId) {
    __typename
    ...OnboardingCampos
    ...ErrorOnboardingCampos
  }
}

# M01-05b «Crea tu cuenta».
mutation CrearCuentaOnboarding($onboardingId: ID!, $entrada: CuentaOnboardingInput!) {
  crearCuentaOnboarding(onboardingId: $onboardingId, entrada: $entrada) {
    __typename
    ... on CuentaOnboarding {
      sesion {
        token
        expiraEn
        refreshToken
        refreshExpiraEn
      }
      onboarding {
        ...OnboardingCampos
      }
    }
    ...ErrorOnboardingCampos
  }
}

mutation EnviarVerificacion($onboardingId: ID!) {
  enviarVerificacion(onboardingId: $onboardingId) {
    __typename
    ...OnboardingCampos
    ...ErrorOnboardingCampos
  }
}

# M01-07c «Intentar de nuevo».
mutation ReintentarOnboarding($onboardingId: ID!) {
  reintentarOnboarding(onboardingId: $onboardingId) {
    __typename
    ...OnboardingCampos
    ...ErrorOnboardingCampos
  }
}

# M01-06: lee el estado guardado (con el token del recorrido).
query ConsultarOnboarding($id: ID!) {
  onboarding(id: $id) {
    ...OnboardingCampos
  }
}

# Con la sesión de la cuenta: al abrir la app y en el home limitado.
query MiVerificacion {
  miVerificacion {
    ...OnboardingCampos
  }
}

# Tras VERIFICADA: el token deja de ser `verificacion-pendiente`.
mutation ActualizarSesion {
  actualizarSesion {
    __typename
    ... on Sesion {
      token
      expiraEn
    }
    ... on ErrorAutenticacion {
      codigo
    }
  }
}

fragment UsuarioCampos on Usuario {
  id
  usuario
  rol
  estado
  creadoEn
  nombre
  idioma
  moneda
  tieneContacto
  documentoEnmascarado
  correo
}

fragment CodigoOnboardingCampos on CodigoOnboardingEnviado {
  correoEnmascarado
  venceEn
}

mutation EnviarCodigoOnboarding($correo: String!) {
  enviarCodigoOnboarding(correo: $correo) {
    __typename
    ...CodigoOnboardingCampos
    ...ErrorOnboardingCampos
  }
}

mutation VerificarCodigoOnboarding($correo: String!, $codigo: String!) {
  verificarCodigoOnboarding(correo: $correo, codigo: $codigo) {
    __typename
    ...CodigoOnboardingCampos
    ...ErrorOnboardingCampos
  }
}

mutation RegistrarCuenta($correo: String!, $clave: String!, $codigo: String!) {
  registrarCuenta(correo: $correo, clave: $clave, codigo: $codigo) {
    __typename
    ... on Sesion {
      token
      expiraEn
      refreshToken
      refreshExpiraEn
      usuario {
        ...UsuarioCampos
      }
    }
    ... on ErrorAutenticacion {
      mensaje
      codigo
    }
  }
}

mutation IniciarSesion($entrada: CredencialesInput!) {
  iniciarSesion(entrada: $entrada) {
    __typename
    ... on Sesion {
      token
      expiraEn
      refreshToken
      refreshExpiraEn
      usuario {
        ...UsuarioCampos
      }
    }
    ... on ErrorAutenticacion {
      mensaje
      codigo
    }
  }
}

query Yo {
  yo {
    ...UsuarioCampos
  }
}

mutation ActualizarPreferencias($entrada: PreferenciasInput!) {
  actualizarPreferencias(entrada: $entrada) {
    __typename
    ... on Usuario {
      ...UsuarioCampos
    }
    ... on ErrorUsuario {
      mensaje
    }
  }
}

# «Olvidé mi contraseña» (v0.43): siempre responde `true`, exista o no la cuenta.
mutation SolicitarRestablecimientoClave($correo: String!) {
  solicitarRestablecimientoClave(correo: $correo)
}

# Acceso con huella o rostro tras cerrar sesión (v0.44): la llave privada vive en el Keystore del teléfono.
mutation RegistrarDispositivo($clavePublica: String!) {
  registrarDispositivo(clavePublica: $clavePublica)
}

mutation DesafioDispositivo($dispositivoId: ID!) {
  desafioDispositivo(dispositivoId: $dispositivoId) {
    reto
    venceEn
  }
}

mutation IniciarSesionConDispositivo($dispositivoId: ID!, $reto: String!, $firma: String!) {
  iniciarSesionConDispositivo(dispositivoId: $dispositivoId, reto: $reto, firma: $firma) {
    __typename
    ... on Sesion {
      token
      expiraEn
      refreshToken
      refreshExpiraEn
      usuario {
        ...UsuarioCampos
      }
    }
    ... on ErrorAutenticacion {
      mensaje
      codigo
    }
  }
}
