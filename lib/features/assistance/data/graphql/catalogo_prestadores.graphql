# HU-M06 (KAN-36): catálogo maestro de prestadores, contrato v0.36 (v0.49: detalle y GRUA). Con `versionLocal` igual a la vigente el BFF responde
# `vigente: true` y la lista vacía (la app sigue con su copia).
query CatalogoPrestadores($versionLocal: String) {
  catalogoPrestadores(versionLocal: $versionLocal) {
    version
    vigente
    prestadores {
      id
      nombre
      tipo
      ciudad
      latitud
      longitud
      activo
      aliado
      especialidad
      direccion
      horario
      fotoUrl
    }
  }
}
